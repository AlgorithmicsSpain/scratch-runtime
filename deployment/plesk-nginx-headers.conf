add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://assets.scratch.mit.edu https://cdn.assets.scratch.mit.edu; media-src 'self' data: blob: https://assets.scratch.mit.edu https://cdn.assets.scratch.mit.edu; connect-src 'self' https://assets.scratch.mit.edu https://cdn.assets.scratch.mit.edu; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors https://lms.algorithmicsespana.com; object-src 'none'; base-uri 'none'; form-action 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
